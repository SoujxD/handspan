# Handspan safety policy.
#
# This file is the single enforcement point for "what is the automation allowed
# to do". It is loaded once at process start and consulted before EVERY action,
# in both discovery and replay. There is no code path that acts on a surface
# without passing through `PolicyEngine.evaluate()`.
#
# The model can propose anything; the policy decides what actually happens.

version: 1

navigation:
  # Exact-match origins. Any navigation outside these is denied outright.
  # Deliberately narrow: this is an allowlist, not a blocklist.
  allowedOrigins:
    - "http://localhost:4300"
    - "http://127.0.0.1:4300"
    # MERIDIAN CORE (Cornerstone Financial Systems v4.2.1) — interface.ai's
    # hosted target. Adding an institution is this line plus a tenant binding.
    - "https://web-sample.interface-hiring.com"

  # Path patterns, matched against the URL path with `:param` wildcards.
  # A navigation must match at least one. This is what stops an agent that has
  # been prompt-injected by page content from wandering into /admin.
  allowedPathPatterns:
    - "/"
    - "/t/:tenant"
    - "/t/:tenant/login"
    - "/t/:tenant/shell"
    - "/t/:tenant/nav"
    - "/t/:tenant/home"
    - "/t/:tenant/member/search"
    - "/t/:tenant/member/results"
    - "/t/:tenant/member/:id"
    - "/t/:tenant/member/:id/subaccount/new"
    - "/t/:tenant/member/:id/subaccount/review"
    - "/t/:tenant/member/:id/subaccount/confirm"

    # MERIDIAN CORE. Paths are enumerated rather than wildcarded so that a
    # route the vendor adds later is denied until a human has looked at it.
    - "/signon"
    - "/menu"
    - "/members"
    - "/members/:id"
    - "/members/:id/transfer"
    - "/members/:id/transfer/review"
    - "/members/:id/transfer/post"
    - "/members/:id/open-share"
    - "/members/:id/open-share/review"
    - "/members/:id/open-share/post"
    - "/members/:id/update"
    - "/members/:id/hold"
    - "/members/:id/hold/review"
    - "/members/:id/hold/post"
    - "/signoff"

  deniedPathPatterns:
    - "/t/:tenant/admin"
    - "/t/:tenant/admin/:rest"

    # MERIDIAN CORE's System Settings screen sets error injection GLOBALLY, and
    # the host is shared with other candidates and stateful in memory. An agent
    # that wandered in there would break someone else's demo. Faults are
    # injected per-request with ?inject=<kind> instead, which affects one
    # response and nobody else. This is what an allowlist is actually for.
    - "/settings"

actions:
  # Action kinds the automation may emit at all. Anything absent is rejected by
  # the type system AND by this list (defence in depth — a new action kind added
  # to the code is inert until it is named here).
  allowed:
    - navigate
    - click
    - type
    - select
    - press
    - read
    - waitFor
    - screenshot

  denied:
    - upload      # file exfiltration surface; not needed for these flows
    - download
    - execute_script

risk:
  # These are JavaScript regular expressions, compiled case-insensitively by the
  # engine. Do NOT write an inline `(?i)` flag: ECMAScript has no inline-flag
  # syntax, the pattern fails to compile, and because these are compiled in the
  # PolicyEngine constructor the failure takes the entire safety layer down at
  # startup. Compiling centrally also stops a policy author from accidentally
  # writing a case-sensitive rule that silently misses "PURGE".
  #
  # Classification is structural — what kind of control is this, and what does
  # its visible name say — rather than a list of known-bad selectors, so it
  # transfers across tenants and vendor skins instead of being rebuilt per
  # institution.
  #
  # safe        -> execute
  # sensitive   -> execute, but redact captured values and mask in screenshots
  # irreversible-> BLOCK, always; escalate to a human rather than proceeding
  irreversiblePatterns:
    - "\\b(delete|remove|purge|void)\\b"
    - "\\b(wire|disburse)\\b"
    - "\\b(close\\s+account|freeze|lock\\s+card)\\b"
    - "\\bpost\\s+transaction\\b"
    # Placing a hold on a member's funds is not undoable from the screen that
    # does it, and MERIDIAN CORE says so itself: its confirmation page carries
    # the banner "IRREVERSIBLE ACTION".
    #
    # Matched on the committing verb rather than the bare word "hold", so that
    # *navigating* to the hold screen is permitted and the commit is what gets
    # refused. That is deliberate: risk is a property of the control that
    # commits an action, not of the link that opens the form. It is also what
    # lets a blocked run hand a supervisor a filled-in form instead of an empty
    # screen — the handoff is worth more when the work is already done.
    - "\\b(apply|post|place|release)\\s+(account\\s+)?hold\\b"

  # Actions that create durable state but are the whole point of the capability.
  # These are `confirmable`: allowed unattended only when the calling agent
  # passes an explicit confirmation token naming the capability.
  confirmablePatterns:
    - "\\b(submit|confirm|create|open\\s+account|approve)\\b"
    # A funds transfer between a member's own shares is a routine teller action
    # with a compensating correction available, so blocking it unconditionally
    # would be theatre: the capability could never run at all, and §3.1 of the
    # brief requires one that posts.
    #
    # The risk actually being managed is executing the WRONG transfer — and
    # that is what the confirmation token (which must name the capability) and
    # the review-screen checkpoint exist to catch. Downgraded from irreversible
    # deliberately and with that argument, not quietly to make a run pass.
    - "\\b(transfer|payment)\\b"
    # Vendor vocabulary, found by classifying MERIDIAN CORE's real button text
    # against this list during recon rather than by assuming it transferred.
    #
    # `open account` did not match "Open Share", and nothing matched "Save
    # Changes" at all — and Update Member Information has NO review screen, so
    # an unattended agent could have rewritten a member's mailing address with
    # no confirmation token. That is precisely the coupling the adaptation was
    # supposed to surface: these patterns were written around the fixture app's
    # wording. The fix is vocabulary, in config, which is the point.
    - "\\b(save|open\\s+share)\\b"

  # Reading these is fine; persisting them raw is not.
  sensitiveNamePatterns:
    - "\\b(ssn|social\\s*security|tax\\s*id|tin)\\b"
    - "\\b(password|passcode|pin|secret|token|api[\\s_-]*key)\\b"
    - "\\b(card|pan|cvv|account\\s*number)\\b"
    - "\\b(dob|date\\s+of\\s+birth)\\b"

    # Labels, not values.
    #
    # A member's name, street address, phone and balance have no dependable
    # regex — "Lovelace, Ada" and "22 Harbor Lane" are indistinguishable from
    # ordinary prose. But the cell that renders them is labelled, and the label
    # is what declares the value regulated. Matching the label is the only
    # mechanism that works for this class at all, which is why every screen
    # this system observes has its labelled values registered for scrubbing
    # before anything reaches disk.
    #
    # This was added after a failed replay wrote a debug dump containing a
    # member's name. On the success path that name is scrubbed, because it is
    # an extracted output classified `pii` and extraction registers it. The
    # failure path dumps the screen without extracting anything — so a failure
    # leaked precisely what a success protected, which is the wrong way round.
    - "\\b(name|member\\s*name|first\\s*name|last\\s*name)\\b"
    - "\\b(e-?mail|phone|mobile|telephone)\\b"
    - "\\b(address|mailing\\s+address|street|city|postcode|zip)\\b"
    - "\\b(balance|available|current\\s+balance)\\b"

redaction:
  # Applied to every log record, every artifact write, and every extracted
  # output before it leaves the process. Order matters: structural rules run
  # before pattern rules so a labelled field wins over a lucky regex match.
  # Deliberately anchored on DIGIT boundaries, not word boundaries.
  #
  # `\b` requires a word/non-word transition, so `\b\d{3}-\d{2}-\d{4}` does not
  # match inside "Tax ID412-88-7301" — there is no boundary between "D" and
  # "4". Legacy screens concatenate a label and its value exactly like that, and
  # a real SSN reached a persisted evidence file because of it.
  #
  # A redaction pattern should fail toward over-matching: an over-redacted log
  # line costs a moment of confusion, a missed one is a reportable incident.
  patterns:
    - name: ssn
      regex: "(?<!\\d)\\d{3}-\\d{2}-\\d{4}(?!\\d)"
      replacement: "[REDACTED:SSN]"
    - name: pan
      regex: "(?<!\\d)(?:\\d[ -]*?){13,19}(?!\\d)"
      replacement: "[REDACTED:PAN]"
    - name: email
      regex: "[\\w.%+-]+@[\\w.-]+\\.[A-Za-z]{2,}"
      replacement: "[REDACTED:EMAIL]"
    # MERIDIAN CORE renders member phone numbers as 555-0142. Anchored on digit
    # boundaries for the same reason the SSN rule is: a legacy screen that
    # concatenates "Phone:555-0142" gives \b nothing to match against.
    - name: phone
      regex: "(?<!\\d)(?:\\(\\d{3}\\)\\s*|\\d{3}[.-])?\\d{3}-\\d{4}(?!\\d)"
      replacement: "[REDACTED:PHONE]"

    - name: bearer
      regex: "\\b(bearer|api[_-]?key|authorization)\\s*[:=]\\s*\\S+"
      replacement: "$1: [REDACTED:CREDENTIAL]"
    - name: anthropic_key
      regex: "sk-ant-[A-Za-z0-9_\\-]{8,}"
      replacement: "[REDACTED:CREDENTIAL]"

  # Values supplied as `secret`-classified inputs are additionally registered at
  # runtime for exact-substring scrubbing, so a credential can never survive in
  # a log even if no regex matches it.
  scrubRuntimeSecrets: true

limits:
  maxStepsPerDiscovery: 40
  maxWallClockMsPerDiscovery: 420000
  maxStepsPerReplay: 60

  # Budget for one step's action plus its checkpoint.
  #
  # Sized for a degraded core system, not a healthy one. These apps do
  # full-page postbacks and a single logical step can involve several
  # server round trips (submit -> redirect -> render), so a budget tuned to
  # the happy path turns ordinary slowness into a spurious timeout. Because
  # waiting is condition-based rather than a fixed sleep, a generous ceiling
  # costs nothing when the app is fast — the checkpoint passes and the step
  # returns immediately.
  defaultActionTimeoutMs: 20000

  maxConsecutiveNoProgress: 3

  # How many times ONE recoverable rule may fire in a single run.
  #
  # The per-step recovery budget catches a stuck step. It cannot catch an
  # endemic condition: an advisory that re-appears on every request never
  # exhausts any single step's budget until late in a long flow, and then
  # surfaces as a resolution failure on whatever step happened to be running —
  # pointing the on-call engineer at a control that was never the problem.
  #
  # Six is chosen to sit above the noise and below a pattern. A legitimate
  # interstitial fires once or twice in a flow; something firing seven times is
  # not an anomaly, it is the institution's new normal, and that is a decision
  # for a person rather than a retry loop.
  maxGuardFiringsPerRun: 6

  # Clean replays required before a capability may be approved.
  #
  # Approval is the gate between "a model wrote this" and "this runs unattended
  # against member accounts", and until now the only thing behind it was
  # someone's judgement. Three successful runs is not a proof of correctness,
  # but it does mean nobody can approve a capability that has never completed
  # once — which was previously possible, and is the cheapest class of mistake
  # to make at 2am.
  minStableRunsBeforeApproval: 3
